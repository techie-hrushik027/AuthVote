<body>
    <main class="container">
        <div class="logo" aria-hidden="true">A</div>

        <span class="demo-label">CI/CD DEPLOYMENT v2</span>

        <h2>Welcome to AuthVote</h2>
        <p class="subtitle">
            Secure student authentication for the digital voting platform.
        </p>

        <form id="loginForm">
            <input type="text" id="prn" placeholder="Student PRN" aria-label="Student PRN" autocomplete="username"
                required>

            <input type="password" id="pin" placeholder="Official PIN" aria-label="Official PIN"
                autocomplete="current-password" required>

            <button type="submit" id="loginButton">
                Authenticate Securely
            </button>
        </form>

        <p class="footer">AuthVote · Secure Digital Voting</p>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", handleLogin);

        async function handleLogin(event) {
            event.preventDefault();

            const prn = document.getElementById("prn").value.trim();
            const pin = document.getElementById("pin").value;
            const button = document.getElementById("loginButton");

            button.disabled = true;
            button.textContent = "Authenticating...";

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prn, pin })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("voter_prn", prn);
                    localStorage.setItem("profile_data", JSON.stringify(data.profile));
                    window.location.href = "/instructions.html";
                } else {
                    alert("Login failed: " + (data.detail || "Please check your credentials."));
                }
            } catch (error) {
                alert("Unable to connect to AuthVote. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "Authenticate Securely";
            }
        }
    </script>
</body>
