apiVersion: apps/v1
kind: Deployment
metadata:
  name: authvote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authvote
  template:
    metadata:
      labels:
        app: authvote
    spec:
      containers:
        - name: authvote
          image: techiehrishi0727/authvote:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: authvote
spec:
  type: NodePort
  selector:
    app: authvote
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
