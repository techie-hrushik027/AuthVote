apiVersion: apps/v1
kind: Deployment
metadata:
  name: authvote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authvote
  template:
    metadata:
      labels:
        app: authvote
    spec:
      containers:
        - name: authvote
          image: techiehrishi0727/authvote:latest
          ports:
            - containerPort: 8000
